apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: shop
spec:
  template:
    spec:
      containers:
        - name: orders
          env:
            - { name: OTEL_SERVICE_NAME, value: "orders" }
            # Python: the auto-instrumentation ships a sitecustomize.py.
            # Putting that directory first on PYTHONPATH is exactly what
            # `opentelemetry-instrument` (and the OTel Operator) do.
            - name: PYTHONPATH
              value: "/usr/local/lib/python3.12/site-packages/opentelemetry/instrumentation/auto_instrumentation"
            # Ship python `logging` records as OTel logs and stamp trace ids on
            # the console format. (Do NOT also set the older
            # OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED, you get duplicates.)
            - { name: OTEL_PYTHON_LOG_CORRELATION, value: "true" }

# kind cluster for the workshop.
# Host ports:
#   3000 -> otelite dashboard (NodePort 30000)
#   8080 -> frontend shop     (NodePort 30080)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: otel-workshop
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30000
        hostPort: 3000
        protocol: TCP
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP

# Jaeger v2. It is built on the OpenTelemetry Collector framework, so this
# file has the same shape as the Collector's: receivers, processors,
# exporters, pipelines, plus Jaeger's own extensions.
#
#   jaeger_storage   where traces live (in memory here) and where the
#                    Monitor tab reads its metrics from (Prometheus)
#   jaeger_query     the UI and the HTTP API on 16686
service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      attributes:
        - name: service.name
          value: jaeger
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: info

extensions:
  jaeger_query:
    storage:
      traces: memory_store
      metrics: prometheus_store
    ui:
      config_file: /etc/jaeger/ui.json
    http:
      endpoint: 0.0.0.0:16686
    grpc:
      endpoint: 0.0.0.0:16685
  jaeger_storage:
    backends:
      memory_store:
        memory:
          max_traces: 50000
    # The Monitor tab (Service Performance Monitoring) runs PromQL against
    # the span_metrics connector output. normalize_* match the names
    # Prometheus produces: traces_span_metrics_calls_total and
    # traces_span_metrics_duration_milliseconds_bucket.
    metric_backends:
      prometheus_store:
        prometheus:
          endpoint: http://prometheus.observability.svc.cluster.local:9090
          normalize_calls: true
          normalize_duration: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: memory_store

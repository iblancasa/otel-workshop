# Jaeger v2, single binary, traces in memory. UI on 16686 (host port 16686).
# Config: jaeger-config.yaml and jaeger-ui.json.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: jaeger }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.22.0
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/jaeger/config.yaml"]
          ports:
            - { name: ui, containerPort: 16686 }
            - { name: grpc-query, containerPort: 16685 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: metrics, containerPort: 8888 }
          volumeMounts:
            - { name: config, mountPath: /etc/jaeger }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: 16686 }
            initialDelaySeconds: 3
      volumes:
        - name: config
          configMap:
            name: jaeger-config
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
spec:
  type: NodePort
  selector: { app: jaeger }
  ports:
    - { name: ui, port: 16686, targetPort: 16686, nodePort: 30686 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: metrics, port: 8888, targetPort: 8888 }

# Perses: dashboards, plus the log explorer (Loki) and trace explorer
# (Jaeger). UI on 8080 inside the cluster, host port 3000.
# Config: perses-config.yaml, provisioned resources in perses/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perses
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: perses }
  template:
    metadata:
      labels: { app: perses }
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: perses
          image: persesdev/perses:v0.54.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/perses/config.yaml
            - --web.listen-address=:8080
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: config, mountPath: /etc/perses/config.yaml, subPath: config.yaml }
            - { name: provisioning, mountPath: /etc/perses/provisioning }
            - { name: data, mountPath: /perses }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8080 }
            initialDelaySeconds: 3
      volumes:
        - name: config
          configMap:
            name: perses-config
        - name: provisioning
          configMap:
            name: perses-provisioning
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: perses
  namespace: observability
spec:
  type: NodePort
  selector: { app: perses }
  ports:
    - { name: http, port: 8080, targetPort: 8080, nodePort: 30000 }

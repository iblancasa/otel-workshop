apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - path: common-otel-env.yaml
    target:
      kind: Deployment
      labelSelector: "language"
  - path: frontend-nodejs.yaml
  - path: orders-python.yaml
  - path: payments-python.yaml
  - path: inventory-java.yaml

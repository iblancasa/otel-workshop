# otelite: single-binary OTLP receiver + dashboard (logs, traces, metrics).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otelite
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: otelite }
  template:
    metadata:
      labels: { app: otelite }
    spec:
      containers:
        - name: otelite
          image: ghcr.io/iblancasa/otelite:feat-service-graph
          imagePullPolicy: IfNotPresent
          args: ["serve", "--addr", "0.0.0.0:3000", "--storage-path", "/data"]
          ports:
            - { name: http, containerPort: 3000 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 2
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: otelite
  namespace: observability
spec:
  type: NodePort
  selector: { app: otelite }
  ports:
    - { name: http, port: 3000, targetPort: 3000, nodePort: 30000 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }

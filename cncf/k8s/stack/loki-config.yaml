# Loki 3, single binary, filesystem storage. Logs arrive over OTLP on
# /otlp/v1/logs. Loki stores a few resource attributes as stream labels
# (service.name, k8s.pod.name, ...), the rest as structured metadata, which
# is why `{service_name="orders"} | trace_id="..."` works without parsing.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Required for OTLP ingestion (default since 3.0, stated here on purpose).
  allow_structured_metadata: true
  # Lets Perses draw the log volume histogram.
  volume_enabled: true

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 50

analytics:
  reporting_enabled: false

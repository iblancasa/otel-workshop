apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: shop
spec:
  template:
    spec:
      containers:
        - name: payments
          env:
            - { name: OTEL_SERVICE_NAME, value: "payments" }
            - name: PYTHONPATH
              value: "/usr/local/lib/python3.12/site-packages/opentelemetry/instrumentation/auto_instrumentation"
            - { name: OTEL_PYTHON_LOG_CORRELATION, value: "true" }
